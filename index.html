
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editable Website</title>
<style>
body { font-family: Arial, sans-serif; margin:0; padding:0; }
header, footer { background: #007BFF; color: white; padding: 20px; text-align: center; }
nav a { color: white; margin: 0 10px; text-decoration: none; }
section { padding: 40px 20px; }
section[contenteditable="true"] { border: 1px dashed #ccc; padding: 10px; transition: all 0.3s; }
section[contenteditable="true"]:focus { outline: 2px solid #007BFF; background: #f9f9f9; }
.color-picker { margin: 10px 0; }
img { max-width: 100%; height: auto; cursor: pointer; }
</style>
</head>
<body>

<header>
  <h1 contenteditable="true">Your Company</h1>
  <nav>
    <a href="#about" contenteditable="true">About</a>
    <a href="#services" contenteditable="true">Services</a>
    <a href="#contact" contenteditable="true">Contact</a>
  </nav>
</header>

<section id="about" contenteditable="true">
  <h2>About Us</h2>
  <p>Click here to edit your about text.</p>
</section>

<section id="services">
  <h2 contenteditable="true">Services</h2>
  <p contenteditable="true">Describe your services here.</p>
  <img src="https://via.placeholder.com/600x300" id="service-img">
  <input type="file" id="imgUpload" style="display:none;">
  <button onclick="document.getElementById('imgUpload').click();">Change Image</button>
</section>

<section id="contact" contenteditable="true">
  <h2>Contact</h2>
  <p>Write your contact info here.</p>
</section>

<footer contenteditable="true">
  &copy; 2025 Your Company
</footer>

<div class="color-picker">
  <label>Background Color: </label>
  <input type="color" id="bgColorPicker" value="#ffffff">
</div>

<script>
// Background color picker
const bgPicker = document.getElementById('bgColorPicker');
bgPicker.addEventListener('input', (e) => {
  document.body.style.backgroundColor = e.target.value;
});

// Image upload
const imgUpload = document.getElementById('imgUpload');
const serviceImg = document.getElementById('service-img');
imgUpload.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if(file) {
    const reader = new FileReader();
    reader.onload = () => serviceImg.src = reader.result;
    reader.readAsDataURL(file);
  }
});

// Save edits in localStorage
document.querySelectorAll('[contenteditable="true"]').forEach(el => {
  const id = el.id || el.tagName + Math.random();
  el.dataset.id = id;
  // Load saved content
  if(localStorage.getItem(id)) el.innerHTML = localStorage.getItem(id);
  el.addEventListener('input', () => localStorage.setItem(id, el.innerHTML));
});
</script>

</body>
</html>
